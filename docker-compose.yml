version: "3.9"

services:
  namenode:
    build: ./namenode
    ports:
      - "8000:8000"
    environment:
      - BLOCK_SIZE=67108864
      - REPLICATION_FACTOR=2
      - HEARTBEAT_TIMEOUT=15
      - JWT_SECRET=changeme
    volumes:
      - ./namenode/data:/app/data
    networks:
      - dfs-network

  datanode1:
    build: ./datanode
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=dn1
      - NAMENODE_URL=http://namenode:8000
      - HEARTBEAT_INTERVAL=5
      - JWT_SECRET=changeme
    volumes:
      - dn1_blocks:/app/blocks
    depends_on:
      - namenode
    networks:
      - dfs-network

  datanode2:
    build: ./datanode
    ports:
      - "8002:8001"
    environment:
      - NODE_ID=dn2
      - NAMENODE_URL=http://namenode:8000
      - HEARTBEAT_INTERVAL=5
      - JWT_SECRET=changeme
    volumes:
      - dn2_blocks:/app/blocks
    depends_on:
      - namenode
    networks:
      - dfs-network

  datanode3:
    build: ./datanode
    ports:
      - "8003:8001"
    environment:
      - NODE_ID=dn3
      - NAMENODE_URL=http://namenode:8000
      - HEARTBEAT_INTERVAL=5
      - JWT_SECRET=changeme
    volumes:
      - dn3_blocks:/app/blocks
    depends_on:
      - namenode
    networks:
      - dfs-network

  client:
    build: ./client
    environment:
      - NAMENODE_URL=http://namenode:8000
    depends_on:
      - namenode
    stdin_open: true
    tty: true
    networks:
      - dfs-network

volumes:
  dn1_blocks:
  dn2_blocks:
  dn3_blocks:

networks:
  dfs-network:
    driver: bridge
